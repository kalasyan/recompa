name: Reports

# Compatibility reports reach the app through the catalog, which the private
# repository kalasyan/recompa-catalog rebuilds every 6 hours. This starts a
# rebuild as soon as a report is opened or discarded, so it shows up in minutes.
# The catalog workflow queues runs, so a burst of reports costs at most two.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

permissions: {}

jobs:
  rebuild:
    if: startsWith(github.event.issue.title, '[compat]')
    runs-on: ubuntu-latest
    steps:
      - name: Start the catalog workflow
        env:
          # Fine-grained token for kalasyan/recompa-catalog only, with Actions: Read and write.
          TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::No CATALOG_DISPATCH_TOKEN secret: the report waits for the next scheduled catalog run."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kalasyan/recompa-catalog/actions/workflows/catalog.yml/dispatches \
            -d '{"ref":"main"}'
