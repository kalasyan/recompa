name: Android

# Checks pull requests. Nightlies of main are built in the private repo
# kalasyan/recompa-nightlies (started by a push webhook through the feedback Worker), so
# pushes to main run nothing here; stable versions come from release.yml.
on:
  pull_request:
    paths-ignore: ["**.md", "site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:test
      - name: Lint and debug build
        run: ./gradlew :app:lintDebug :app:assembleDebug
