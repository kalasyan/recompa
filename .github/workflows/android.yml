name: Android

on:
  pull_request:
    paths-ignore: ["**.md", "site/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:test
      - name: Lint and debug build
        run: ./gradlew :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: recompa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Every build of main becomes a private "nightly-N" draft release, signed with the public
  # debug key. Drafts are only visible to the repository's collaborators, so the public only
  # sees stable releases (release.yml). Only the last few nightlies are kept.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: recompa-debug-apk
          path: apk
      - name: Publish nightly draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk recompa.apk
          gh release create "nightly-${GITHUB_RUN_NUMBER}" recompa.apk \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Nightly ${GITHUB_RUN_NUMBER}" \
            --notes "Build automática de main (${GITHUB_SHA::7})."
      # Drafts have no tag; older nightlies published before they became drafts do.
      - name: Prune old nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' \
            | grep '^nightly-' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -r -n1 gh release delete --yes
