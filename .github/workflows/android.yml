name: Android

on:
  pull_request:
    paths-ignore: ["catalog/**", "tools/catalog/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["catalog/**", "tools/catalog/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:test
      - name: Lint and debug build
        run: ./gradlew :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: recompa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Every build of main becomes a "nightly-N" release, signed with the public debug key.
  # Until the first stable release (release.yml) it is marked as latest; after that it is a
  # prerelease. Only the last few nightlies are kept.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: recompa-debug-apk
          path: apk
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk recompa.apk
          # Once a stable vX.Y.Z release exists it is "latest"; nightlies become prereleases.
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -q '^v'; then
            channel="--prerelease --latest=false"
          else
            channel="--latest"
          fi
          gh release create "nightly-${GITHUB_RUN_NUMBER}" recompa.apk \
            $channel \
            --target "$GITHUB_SHA" \
            --title "Nightly ${GITHUB_RUN_NUMBER}" \
            --notes "Build automática de main (${GITHUB_SHA::7})."
      - name: Prune old nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^nightly-' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
