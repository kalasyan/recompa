name: Style screenshots

# Run by hand: builds the app and saves the library and a port page in every app style, on a
# landscape emulator with the live catalog, as a downloadable artifact and on the
# feat/style-screenshots branch (force-pushed, images only).
on:
  workflow_dispatch:
  push:
    branches: [feat/temas]  # TEMP: removed before merging

permissions:
  contents: write

jobs:
  styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        # A build number above every nightly, so the app doesn't show its update banner.
        run: GITHUB_RUN_NUMBER=999999 ./gradlew :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/style-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: style-screenshots
          path: style-screenshots/*.png
      - name: Push the screenshots to their branch
        run: |
          cd style-screenshots
          git init -q -b feat/style-screenshots
          git config user.name kalasyan
          git config user.email 10440484+kalasyan@users.noreply.github.com
          git add *.png
          git commit -qm "Screenshots of every app style"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" feat/style-screenshots
