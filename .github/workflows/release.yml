name: Release

# Pushing a tag like v0.2.0 builds Recompa with the private release key and publishes
# it as the latest GitHub release, with the APK at
# https://github.com/kalasyan/recompa/releases/latest/download/recompa.apk
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RECOMPA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing RECOMPA_KEYSTORE_BASE64 secret; see RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RECOMPA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "RECOMPA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test, lint and build the release APK
        env:
          RECOMPA_KEYSTORE_PASSWORD: ${{ secrets.RECOMPA_KEYSTORE_PASSWORD }}
          RECOMPA_KEY_ALIAS: ${{ secrets.RECOMPA_KEY_ALIAS }}
          RECOMPA_KEY_PASSWORD: ${{ secrets.RECOMPA_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:lintRelease :app:assembleRelease
      - name: Check the signature
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          cp "$apk" recompa.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" recompa.apk \
            --latest \
            --verify-tag \
            --title "Recompa $RECOMPA_VERSION" \
            --generate-notes
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
