name: Catalog

on:
  pull_request:
    paths: ["catalog/**", "tools/catalog/**", ".github/workflows/catalog.yml"]
  push:
    branches: [main]
    paths: ["catalog/**", "tools/catalog/**", ".github/workflows/catalog.yml"]
  schedule:
    - cron: "17 */6 * * *"   # pick up new releases of the ports
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/catalog/requirements.txt
      - run: pip install -r tools/catalog/requirements.txt
      - name: Unit tests
        run: pytest -q tools/catalog
      - name: Validate manifests
        run: python tools/catalog/build_index.py --offline
      - name: Put apksigner on PATH
        run: echo "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" >> "$GITHUB_PATH"
      - name: Build index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: >-
          python tools/catalog/build_index.py
          --out catalog/dist/index.json
          --previous "$PAGES_INDEX_URL"
          --download --verify-signers
          --reports "${{ github.repository }}"
      - name: Assemble site
        run: |
          mkdir -p catalog/dist/schema
          cp catalog/schema/port.schema.json catalog/dist/schema/
          if [ -d catalog/media ]; then cp -r catalog/media catalog/dist/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
