id: isaac-recomp
name: "Isaac Recomp"
game: "The Binding of Isaac"
original_platform: pc
type: recomp
upstream: https://github.com/whylurking/IsaacRecomp
description: "Recompilación nativa en C++ del juego original en Flash. Necesita tu copia de Steam."

forks:
  - repo: whylurking/IsaacRecomp
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
