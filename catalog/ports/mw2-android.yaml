id: mw2-android
name: "MW2 Android"
game: "Call of Duty: Modern Warfare 2"
original_platform: xbox360
type: recomp
upstream: https://github.com/OpenPort-Labs/mw2-android
description: "Port experimental de la campaña con Vulkan, táctil y mando. Necesita tu copia de Xbox 360."

forks:
  - repo: OpenPort-Labs/mw2-android
    channel: beta
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
  vulkan: true
