id: skate3-mobile
name: "Skate 3 Mobile"
game: "Skate 3"
original_platform: xbox360
type: recomp
upstream: https://github.com/Buku313/Skate3-Mobile
description: "Recompilación nativa con Vulkan: instalas el APK y eliges tu ISO."

forks:
  - repo: Buku313/Skate3-Mobile
    asset_pattern: '(?i)-Android\.apk$'
  - repo: andrewnakas/skate3-android
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
  vulkan: true
