id: shaolin-monks
name: "Shaolin Monks para Android"
game: "Mortal Kombat: Shaolin Monks"
original_platform: xbox
type: recomp
upstream: https://github.com/RanggaCasper/ShaolinMonks-Android
description: "Port no oficial mediante XboxXBERecomp con Vulkan. Necesita tu copia de Xbox."

forks:
  - repo: RanggaCasper/ShaolinMonks-Android
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
  vulkan: true
