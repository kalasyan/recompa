id: dk64-recomp
name: "Donkey Kong 64: Recompiled"
game: "Donkey Kong 64"
original_platform: n64
type: recomp
upstream: https://github.com/deivid22srk/dk64-recomp-android
description: "Recompilación estática de Donkey Kong 64 con RT64 y Vulkan. Necesita tu ROM de N64."

forks:
  - repo: deivid22srk/dk64-recomp-android
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
  vulkan: true
