id: gta-vcs-recomp
name: "VCS Android"
game: "Grand Theft Auto: Vice City Stories"
original_platform: psp
type: recomp
upstream: https://github.com/codepdbh/PSPRecomp-VCS-Android
description: "Port experimental con Vulkan, panorámico y modo de 30 fps. Necesita tu copia de PSP."

forks:
  - repo: codepdbh/PSPRecomp-VCS-Android
    channel: beta
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
  vulkan: true
