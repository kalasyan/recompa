id: halo-ce
name: "Halo CE Android"
game: "Halo: Combat Evolved"
original_platform: xbox
type: decomp
upstream: https://github.com/FulGerNet/halo-ce-android
description: "Ports de Halo: Combat Evolved basados en su decompilación, con mando y controles táctiles. Necesita tu copia del juego."

forks:
  - repo: FulGerNet/halo-ce-android
    asset_pattern: '(?i)\.apk$'
  - repo: Andiweli/HaloCE-Android-AAOS
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
