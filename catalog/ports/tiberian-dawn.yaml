id: tiberian-dawn
name: "Tiberian Dawn para Android"
game: "Command & Conquer"
original_platform: pc
type: source-port
upstream: https://github.com/Cesarus85/Tiberian-Dawn-for-Android-and-Meta-Quest
description: "Prototipo de port de Tiberian Dawn para móviles y tabletas. Necesita los datos del juego."

forks:
  - repo: Cesarus85/Tiberian-Dawn-for-Android-and-Meta-Quest
    asset_pattern: '(?i)mobile.*\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
