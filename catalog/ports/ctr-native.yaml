id: ctr-native
name: "CTR Native"
game: "Crash Team Racing"
original_platform: ps1
type: decomp
upstream: https://github.com/igawa6/ctr-native-android
description: "Fork de CTR Native con segunda pantalla, build de 64 bits y opciones gráficas. Necesita tu disco de PS1."

forks:
  - repo: igawa6/ctr-native-android
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
