id: ghostship
name: "Ghostship"
game: "Super Mario 64"
original_platform: n64
type: decomp
upstream: https://github.com/HarbourMasters/Ghostship
description: "Port de Super Mario 64 de HarbourMasters basado en su decompilación. Necesita tu ROM de N64."

forks:
  - repo: HarbourMasters/Ghostship
    asset_pattern: '(?i)android.*\.zip$'
    zip_entry: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
