id: goemon64-recomp
name: "Goemon 64: Recompiled"
game: "Mystical Ninja Starring Goemon"
original_platform: n64
type: recomp
upstream: https://github.com/ogdanimal/Goemon64Recomp-Android
description: "Recompilación de Goemon con RT64 sobre Vulkan. Necesita tu ROM de N64."

forks:
  - repo: ogdanimal/Goemon64Recomp-Android
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
  vulkan: true
