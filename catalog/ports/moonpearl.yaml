id: moonpearl
name: "moonpearl"
game: "The Legend of Zelda: A Link to the Past"
original_platform: snes
type: decomp
upstream: https://github.com/DoutorRaposo/moonpearl
description: "Port nativo de la reimplementación zelda3, con panorámico, estados guardados y rebobinado. Necesita tu ROM de SNES."

forks:
  - repo: DoutorRaposo/moonpearl
    asset_pattern: '(?i)\.apk$'
  - repo: Waterdish/zelda3-android
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
