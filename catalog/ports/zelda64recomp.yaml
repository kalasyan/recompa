id: zelda64recomp
name: "Zelda 64: Recompiled"
game: "The Legend of Zelda: Majora's Mask"
original_platform: n64
type: recomp
upstream: https://github.com/Zelda64Recomp/Zelda64Recomp
description: >-
  Recompilación estática de Majora's Mask con pantalla panorámica, alta tasa de
  imágenes y soporte de mods.

forks:
  - repo: linkzenic/Zelda64Recomp-Android
    channel: beta
    asset_pattern: '(?i)\.apk$'
    package: io.github.zelda64recomp
    signer_sha256: f608b8ed8a09fd6c8890dee105f3268ad5577638ec3aa2544ff4618f399efd3e
    verified: true
    tested_on: ["AYN Thor"]

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
  vulkan: true

assets:
  - id: rom
    label: "ROM de Majora's Mask (N64)"
    # Zelda64Recomp only accepts the US 1.0 ROM (game_id mm.n64.us.1.0); SHA-1
    # from 2ship2harkinian's docs/supportedHashes.json ("NTSC-U 1.0").
    accepted:
      - sha1: d6133ace5afaa0882cf214cf88daba39e266c078
        label: "EE.UU. 1.0"
        format: z64
    convert_from: [v64, n64]
    zip_ok: true
    delivery:
      mode: in_app_picker
      path: "Zelda64/"
    instructions_md: |
      Abre el port y, cuando pida la ROM, elige el archivo que ha preparado Recompa.
