id: recompiled-steel
name: "ReCompiled Steel"
game: "Real Steel"
original_platform: xbox360
type: recomp
upstream: https://github.com/tokeneffortports/ReCompiledSteel
description: "Port nativo con Vulkan, juego online y mods. Necesita tu copia de Xbox 360."

forks:
  - repo: tokeneffortports/ReCompiledSteel
    asset_pattern: '(?i)\.apk$'

requirements:
  abi: [arm64-v8a]
  min_sdk: 24
  vulkan: true
