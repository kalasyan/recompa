id: windwaker-hd-recomp
name: "Wind Waker HD Recomp"
game: "The Legend of Zelda: The Wind Waker HD"
original_platform: wiiu
type: recomp
upstream: https://github.com/ZeldaWWHDRecomp/ZeldaWWHDRecomp
description: "Recompilación estática de Wind Waker HD de Wii U. Varias versiones de Android de la comunidad. Necesita tu copia del juego."

forks:
