    asset_pattern: '(?i)\.apk$'
  - repo: Nycolazs/WindWakerHD-Android-Plus
    asset_pattern: '(?i)\.apk$'
  - repo: SSunnKing/ZeldaWWHDRecompAndroid---ENHANCED
    asset_pattern: '(?i)\.apk$'

requirements:
